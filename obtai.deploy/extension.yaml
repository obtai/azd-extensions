# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/refs/heads/main/cli/azd/extensions/extension.schema.json

# The namespace is `obt`, not `deploy`: `azd deploy` is a core command, and azd
# does not check an extension's namespace against its own — `namespace: deploy`
# installs cleanly and is then silently unreachable behind the built-in.
#
# It is not `preview` either. Three of this extension's four lifecycle handlers
# serve an ordinary release and never run for a preview, so naming the whole
# thing after previews would be naming it after a quarter of what it does — and
# would leave `azd obt rollback` nowhere sensible to live.
# `metadata` is declared because the binary implements the `metadata` command —
# azd invokes it at install time and caches the result for help and IntelliSense,
# but ONLY if the capability is declared. Shipping the command without it is a
# command nothing ever calls.
#
# Not declared, and why: `service-target-provider` and `framework-service-provider`
# register a `host:` and a `language:` for azure.yaml, and consumers use the
# built-in `containerapp` and `js`. `provisioning-provider` would replace azd's
# Bicep flow, which is exactly what we want it to keep doing. `validation-provider`
# contributes read-only checks, and this extension's preprovision step seeds
# secrets rather than merely inspecting them.
capabilities:
    - custom-commands
    - lifecycle-events
    - metadata
description: Release lifecycle and per-PR previews for Azure Container Apps.
displayName: OBT deployments
id: obtai.deploy
language: go
namespace: obt
usage: azd obt <command> [options]
version: 0.0.1
